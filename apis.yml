aid: nexu
name: Nexu
description: >-
  Nexu is a Mexico City fintech that provides automotive financing at the point of sale.
  Founded in 2014 by Abdon Nacif and Fernando Gomez Arriola, the company began as an auto
  price and comparison site and now operates a digital lending platform used by car
  dealerships across Mexico to originate credit and leasing offers in real time. Nexu
  underwrites and funds two consumer products - credito automotriz (auto credit) and
  arrendamiento (leasing with a purchase option and no residual), distributed through
  partnerships with more than ten OEM dealer networks including Nissan, Volkswagen, Kia,
  Hyundai, Mazda, Honda, Ford, Chevrolet, BMW and Audi. Applicants complete an onboarding
  and identity flow in a browser application at nexu.mx and receive a decision without
  visiting a branch. The company has raised roughly $73M across five equity rounds, plus
  debt facilities, from Valor Capital Group, Altos Ventures, Wollef, Architect Capital,
  Clocktower, Tresalia Capital, FJ Labs, Gilgamesh Ventures and others. As of this
  profiling pass Nexu publishes no public API, developer portal, SDK or machine-readable
  contract of any kind - see x-coverage below.
